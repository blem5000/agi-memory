name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Run Verification Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Run verification test suites
        run: |
          python tests/test_offline.py
          python tests/eval_l1.py
          python tests/eval_l2.py
          python tests/eval_l3.py
          python tests/eval_l4.py
          python -m agi_memory.integrate test
          python tests/stress_test.py

  formula:
    name: Update Homebrew Formula Checksum
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # A formula's checksum is the hash of the tag's own tarball, so it cannot
      # exist in the commit being tagged -- it is only computable afterwards.
      # This job used to verify it and therefore failed at every single release,
      # and was patched by hand each time. It now does the update instead: the
      # only thing a human was contributing was running a script.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the tag tarball to exist
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          # GitHub builds the archive on first request; it can 404 for a moment
          # after the tag is pushed.
          for i in 1 2 3 4 5; do
            if curl -sfL -o /tmp/tag.tar.gz "$URL"; then
              echo "sha256: $(sha256sum /tmp/tag.tar.gz | cut -d' ' -f1)"
              exit 0
            fi
            echo "attempt $i: tarball not available yet, retrying"
            sleep 10
          done
          echo "::error::tag tarball never became available at $URL"
          exit 1

      - name: Point the formula at this tag
        run: python3 packaging/update_formula.py "${GITHUB_REF_NAME#v}"

      - name: Commit if the formula changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/; then
            echo "Formula already correct for ${GITHUB_REF_NAME}; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore(release): point the formula at the ${GITHUB_REF_NAME} tarball"
          # Pushed with GITHUB_TOKEN, which deliberately does not retrigger
          # workflows, so this cannot loop.
          git push origin HEAD:main

      - name: Formula must now match the tarball
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum /tmp/tag.tar.gz | cut -d' ' -f1)"
          FAILED=0
          for f in Formula/*.rb; do
            CLAIMED="$(grep -oE 'sha256 "[0-9a-f]{64}"' "$f" | grep -oE '[0-9a-f]{64}')"
            if [ "$CLAIMED" != "$ACTUAL" ]; then
              echo "::error file=$f::checksum still does not match ${GITHUB_REF_NAME} (claims $CLAIMED)"
              FAILED=1
            else
              echo "$f OK"
            fi
          done
          exit $FAILED

  build:
    name: Build Distribution Packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify checksums
        run: |
          cd dist
          sha256sum *

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agi-memory
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
